{{- $r := .Values.runtime -}}
{{- if or (lt (int .Values.scaling.min) 0) (le (int .Values.scaling.max) (int .Values.scaling.min)) }}{{ fail "scaling.max must exceed nonnegative scaling.min" }}{{ end }}
{{- if lt (int .Values.scaling.queueLength) 1 }}{{ fail "queueLength must be positive" }}{{ end }}
{{- range $service, $item := dict "cart" (dict "queue" "cart-queue" "worker" "carts-worker") "orders" (dict "queue" "orders-queue" "worker" "orders-worker") "checkout" (dict "queue" "checkout-queue" "worker" "checkout-worker") }}
{{- if index $.Values.workers $service }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ $item.worker }}-sqs
  namespace: {{ $r.namespaces.retailstore }}
spec:
  scaleTargetRef: {name: {{ $item.worker }}}
  minReplicaCount: {{ $.Values.scaling.min }}
  maxReplicaCount: {{ $.Values.scaling.max }}
  pollingInterval: {{ $.Values.scaling.pollingInterval }}
  cooldownPeriod: {{ $.Values.scaling.cooldownPeriod }}
  triggers:
    - type: aws-sqs-queue
      metadata:
        queueURL: {{ required (printf "Missing queue %s" $item.queue) (index $r.queue_urls $item.queue) | quote }}
        awsRegion: {{ $r.region | quote }}
        queueLength: {{ $.Values.scaling.queueLength | quote }}
        scaleOnInFlight: 'true'
      authenticationRef:
        kind: ClusterTriggerAuthentication
        name: keda-sqs-pod-identity
{{- end }}
{{- end }}
