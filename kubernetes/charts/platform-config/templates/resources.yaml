{{- if .Values.nodePool.enabled }}
{{- $r := .Values.runtime -}}
{{- $alias := required "Set nodePool.amiAlias to a tested al2023@vYYYYMMDD alias" .Values.nodePool.amiAlias -}}
{{- if eq $alias "al2023@latest" }}{{ fail "Pin a tested AMI alias; latest is not allowed" }}{{ end }}
apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: {{ .Values.nodePool.name }}
spec:
  role: {{ required "runtime.node_role required" $r.node_role | quote }}
  amiSelectorTerms:
    - alias: {{ $alias | quote }}
  subnetSelectorTerms:
    - tags:
        karpenter.sh/discovery: {{ $r.cluster_name | quote }}
  securityGroupSelectorTerms:
    {{- range $r.security_group_ids }}
    - id: {{ . | quote }}
    {{- end }}
  tags:
    karpenter.sh/discovery: {{ $r.cluster_name | quote }}
    Environment: {{ $r.environment | quote }}
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: {{ .Values.nodePool.name }}
spec:
  template:
    metadata:
      labels: {role: worker}
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: {{ .Values.nodePool.name }}
      requirements:
        - {key: kubernetes.io/arch, operator: In, values: [amd64]}
        - {key: kubernetes.io/os, operator: In, values: [linux]}
        - key: karpenter.sh/capacity-type
          operator: In
          values: {{ .Values.nodePool.capacityTypes | toJson }}
        - key: karpenter.k8s.aws/instance-category
          operator: In
          values: {{ .Values.nodePool.instanceCategories | toJson }}
        - {key: karpenter.k8s.aws/instance-generation, operator: Gt, values: ['2']}
  limits:
    cpu: {{ .Values.nodePool.cpuLimit | quote }}
    memory: {{ .Values.nodePool.memoryLimit | quote }}
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: {{ .Values.nodePool.consolidateAfter }}
{{- end }}
---
apiVersion: keda.sh/v1alpha1
kind: ClusterTriggerAuthentication
metadata:
  name: keda-sqs-pod-identity
spec:
  podIdentity:
    provider: aws
    identityOwner: keda
