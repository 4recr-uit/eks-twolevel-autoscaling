# Sửa endpoint, queue URL và image/tag theo môi trường trước khi triển khai.
image:
  repository: 150105760238.dkr.ecr.us-east-1.amazonaws.com/checkout
  tag: latest
  pullPolicy: Always
fullnameOverride: checkout
database:
  host: twolevel-autoscaling-dev-postgres.ceb0a0oo6thh.us-east-1.rds.amazonaws.com
  port: 5432
  user: checkout_app
  name: retaildb
  sslmode: verify-full
  secret: { create: false, name: checkout-db }
api:
  serviceMonitor: { enabled: true }
  nodeSelector: { eks.amazonaws.com/nodegroup: null, role: system }
worker:
  serviceMonitor: { enabled: true }
  externalAutoscaling: false
  replicaCount: 1
  nodeSelector: {}
  tolerations: []
  scaledObject: { enabled: false }

sqs:
  queueUrl: https://sqs.us-east-1.amazonaws.com/150105760238/checkout-queue
  region: us-east-1
  endpoint: ""
apiServiceAccount: { create: false, name: checkout-api }
workerServiceAccount: { create: false, name: checkout-worker }

# CA ConfigMap must exist in namespace retailstore before deploying.
databaseTLS:
  enabled: true
  caConfigMapName: rds-ca
