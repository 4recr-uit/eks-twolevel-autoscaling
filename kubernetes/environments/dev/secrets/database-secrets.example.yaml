# Copy to database-secrets.local.yaml before entering real passwords.
# Replace all five REPLACE_WITH_... lines. Do not apply this example directly.
# Keep each password on one indented line after |-. Quotes, #, $, : and backslashes
# are literal here; do not surround passwords with quotes or add a comment.
# Usernames for PostgreSQL and Recommendations come from apps/*.yaml.
# This file contains credentials only, not TLS/CA configuration.
apiVersion: v1
kind: Secret
metadata:
  name: cart-db
  namespace: retailstore
type: Opaque
stringData:
  DB_PASSWORD: |-
    REPLACE_WITH_CART_DB_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: orders-db
  namespace: retailstore
type: Opaque
stringData:
  DB_PASSWORD: |-
    REPLACE_WITH_ORDERS_DB_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: checkout-db
  namespace: retailstore
type: Opaque
stringData:
  DB_PASSWORD: |-
    REPLACE_WITH_CHECKOUT_DB_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: catalog-db
  namespace: retailstore
type: Opaque
stringData:
  RETAIL_CATALOG_PERSISTENCE_USER: catalog_app
  RETAIL_CATALOG_PERSISTENCE_PASSWORD: |-
    REPLACE_WITH_CATALOG_DB_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: recommendations-db
  namespace: retailstore
type: Opaque
stringData:
  RETAIL_RECOMMENDATIONS_PERSISTENCE_PASSWORD: |-
    REPLACE_WITH_RECOMMENDATIONS_DB_PASSWORD
