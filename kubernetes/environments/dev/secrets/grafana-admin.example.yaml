# Copy to grafana-admin.example.yaml before entering real passwords.
# Replace the REPLACE_WITH_GRAFANA_ADMIN_PASSWORD line. Do not apply this example directly
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
  namespace: monitoring
type: Opaque
stringData:
  admin-user: admin
  admin-password: |-
    REPLACE_WITH_GRAFANA_ADMIN_PASSWORD
