# Overlay dùng cùng kubernetes/environments/dev/platform.yaml.
# Release E5 sở hữu riêng NodePool/NodeClass; không tạo auth/monitor chung.
nodePool:
  enabled: true
  name: e5-orders
  instanceTypes: [c7i-flex.large]
  capacityTypes: [on-demand]
  cpuLimit: "8"
  memoryLimit: 16Gi
  consolidateAfter: Never
kedaAuthentication:
  enabled: false
monitoring: false
