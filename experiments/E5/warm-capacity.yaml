# Tạm giữ chỗ tương đương 10 worker với requests tương đương Orders.
# Trước khi xóa Deployment, bảo vệ các node cần giữ bằng annotation karpenter.sh/do-not-disrupt=true.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e5-warm-capacity
  namespace: retailstore
  labels:
    experiments.retailstore.dev/owner: e5
spec:
  replicas: 10
  selector:
    matchLabels:
      app: e5-warm-capacity
  template:
    metadata:
      labels:
        app: e5-warm-capacity
    spec:
      nodeSelector:
        karpenter.sh/nodepool: e5-orders
      containers:
        - name: reserve
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
