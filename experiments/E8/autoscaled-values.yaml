worker:
  externalAutoscaling: true
  nodeSelector:
    karpenter.sh/nodepool: e8-orders
  # E8 uses a larger request to make node capacity visible under the pilot load.
  # Keep identical in baseline and fault branches and revalidate throughput after E0.
  resources:
    requests:
      cpu: 500m
      memory: 256Mi
  scaledObject:
    enabled: false
