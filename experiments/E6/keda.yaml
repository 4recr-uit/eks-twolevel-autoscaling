apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: e6-spot-orders-sqs-auth
  namespace: retailstore
  labels:
    experiments.retailstore.dev/owner: e6
spec:
  podIdentity:
    provider: aws
    identityOwner: keda
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: e6-spot-orders-sqs
  namespace: retailstore
  labels:
    experiments.retailstore.dev/owner: e6
spec:
  scaleTargetRef:
    name: orders-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      name: e6-spot-orders-keda-hpa
  triggers:
    - type: aws-sqs-queue
      authenticationRef:
        name: e6-spot-orders-sqs-auth
      metadata:
        queueURLFromEnv: SQS_QUEUE_URL
        awsRegion: us-east-1
        queueLength: "10"
        scaleOnInFlight: "true"
