# Overlay dùng cùng kubernetes/environments/dev/platform.yaml.
# Release E6 sở hữu riêng NodePool/NodeClass; không tạo auth/monitor chung.
nodePool:
  enabled: true
  name: e6-spot-orders
  instanceTypes: [c7i-flex.large]
  capacityTypes: [spot]
  cpuLimit: "12"
  memoryLimit: 24Gi
  consolidateAfter: Never
kedaAuthentication:
  enabled: false
monitoring: false
