# Overlay dùng cùng kubernetes/environments/dev/platform.yaml.
# Release E7 sở hữu riêng NodePool/NodeClass; không tạo auth/monitor chung.
nodePool:
  enabled: true
  name: e7-orders
  instanceTypes: [c7i-flex.large]
  capacityTypes: [on-demand]
  cpuLimit: "12"
  memoryLimit: 24Gi
  consolidateAfter: Never
kedaAuthentication:
  enabled: false
monitoring: false
