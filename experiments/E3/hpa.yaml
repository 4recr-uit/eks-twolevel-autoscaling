apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: e3-orders-cpu
  namespace: retailstore
  labels:
    experiments.retailstore.dev/owner: e3
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-worker
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
