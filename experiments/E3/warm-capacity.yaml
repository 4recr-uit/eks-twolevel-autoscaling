# Bốn Pod tạm, mỗi Pod trên một node E3; xóa sau khi tất cả Ready.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: e3-warm-capacity
  namespace: retailstore
  labels:
    experiments.retailstore.dev/owner: e3
spec:
  replicas: 4
  selector:
    matchLabels:
      app: e3-warm-capacity
  template:
    metadata:
      labels:
        app: e3-warm-capacity
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: e3-warm-capacity
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        karpenter.sh/nodepool: e3-orders
      containers:
        - name: reserve
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
